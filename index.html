<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Свадьба — 26 октября 2026</title>
  <style>
    body {
      margin: 0;
      font-family: "Georgia", serif;
      color: #fff;
      text-align: center;
      background: url("tBXcoY2G4RNcM6fU7a2yx.jpeg") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0,0,0,0.35);
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .content {
      position: relative;
      padding: 60px 20px;
      z-index: 2;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
      font-weight: normal;
    }

    .intro {
      font-size: 22px;
      max-width: 700px;
      margin: 0 auto 40px auto;
      line-height: 1.4;
    }

    .timer {
      margin: 30px auto;
      font-size: 26px;
      font-weight: bold;
    }

    .calendar {
      width: 340px;
      margin: 40px auto;
      padding: 20px;
      background: rgba(255,255,255,0.85);
      border-radius: 12px;
      color: #333;
    }

    .calendar h3 {
      margin: 0 0 10px;
      font-size: 24px;
      color: #b08c5a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 18px;
    }

    td {
      padding: 10px;
    }

    .highlight {
      background: #b08c5a;
      color: white;
      border-radius: 50%;
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<div class="content">

  <h1>Сильвия & Корюн</h1>

  <div class="intro">
    Уважаемые гости, приглашаем вас на торжественное мероприятие, которое состоится
    <b>26 октября</b> в ресторане <b>Робинзон Крузо</b> по адресу <b>Тепличная 78/1</b>.
  </div>

  <div class="timer" id="countdown"></div>

  <div class="calendar">
    <h3>Октябрь 2026</h3>
    <table>
      <tr>
        <td>Пн</td><td>Вт</td><td>Ср</td><td>Чт</td><td>Пт</td><td>Сб</td><td>Вс</td>
      </tr>

      <tr>
        <td></td><td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td>
      </tr>
      <tr>
        <td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td>
      </tr>
      <tr>
        <td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td>
      </tr>
      <tr>
        <td>20</td><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td><td class="highlight">26</td>
      </tr>
      <tr>
        <td>27</td><td>28</td><td>29</td><td>30</td><td>31</td><td></td><td></td>
      </tr>
    </table>
  </div>

</div>

<script>
  const weddingDate = new Date("2026-10-26T17:00:00");

  function updateCountdown() {
    const now = new Date();
    const diff = weddingDate - now;

    if (diff <= 0) {
      document.getElementById("countdown").innerHTML = "Свадьба началась!";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerHTML =
      `До свадьбы осталось: ${days} дн. ${hours} ч. ${minutes} мин. ${seconds} сек.`;
  }

  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
